# Local Home Assistant dev environment for Lovelacer development.
#
# Brings up a HA Core instance pre-loaded with fixture entities for
# heuristic and generator development.
#
# Usage:
#   pnpm dev:ha           # bring up
#   pnpm dev:ha:logs      # follow logs
#   pnpm dev:ha:down      # tear down (state persists in ha-config/)
#
# After first start:
#   1. Open http://localhost:8123
#   2. Create an admin account (any credentials, local only)
#   3. Skip area setup (we provision via fixture)
#   4. Generate a long-lived token in profile -> security
#   5. Save it to .env at the repo root as HA_TOKEN=<token>
#
# To reset everything: pnpm dev:ha:down && rm -rf dev/ha-config

services:
  homeassistant:
    container_name: lovelacer-dev-ha
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    ports:
      - '8123:8123'
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Prague
    # No privileged mode needed for dev — we don't talk to host hardware
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8123']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Optional: Ollama for local AI development (Phase 4+)
  # Uncomment when working on AI features.
  # ollama:
  #   container_name: lovelacer-dev-ollama
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - '11434:11434'
  #   volumes:
  #     - ./ollama-data:/root/.ollama

addon:
  - changed-files:
      - any-glob-to-any-file: 'apps/addon/**'

server:
  - changed-files:
      - any-glob-to-any-file: 'packages/server/**'

web:
  - changed-files:
      - any-glob-to-any-file: 'packages/web/**'

analyzer:
  - changed-files:
      - any-glob-to-any-file: 'packages/analyzer/**'

generator:
  - changed-files:
      - any-glob-to-any-file: 'packages/generator/**'

ha-client:
  - changed-files:
      - any-glob-to-any-file: 'packages/ha-client/**'

shared:
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'dev/**'
          - 'scripts/**'

docs:
  - changed-files:

  <!-- Gradient fade at bottom to imply more content -->
  <defs>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="56" y="900" width="1517" height="367" fill="url(#fadeBottom)"/>

  <!-- Helper text overlay -->

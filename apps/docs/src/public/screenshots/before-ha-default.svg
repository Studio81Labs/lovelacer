      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">sensor.house_lighting_row_02</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">Input 3</text>
    </g>
    <g transform="translate(800, 280)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">update.0x842b95_firmware</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">up to date</text>

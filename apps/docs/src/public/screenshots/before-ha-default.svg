      <circle cx="30" cy="30" r="14" fill="#10B981"/>
      <text x="56" y="26" font-size="13">binary_sensor.0x842_cloud</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">connected</text>
    </g>
    <g transform="translate(440, 360)">

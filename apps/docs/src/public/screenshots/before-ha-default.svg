    <g transform="translate(800, 680)" opacity="0.7">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">binary_sensor.0x158d_battery</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">normal</text>

      <text x="56" y="26" font-size="13">sensor.0x842b95_linkquality</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">192</text>
    </g>
    <g transform="translate(1160, 200)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">sensor.0x158d_voltage</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1573 1267" role="img" aria-label="Home Assistant's stock auto-generated dashboard">
  <title>Home Assistant default dashboard</title>
  <desc>Representative example of Home Assistant's automatically generated dashboard before any organization. Shows the wall of entities a typical install presents to a new user.</desc>

  <!-- HA dark theme background -->
  <rect width="1573" height="1267" fill="#111827"/>

  <!-- HA sidebar simulation (narrow) -->
  <rect x="0" y="0" width="56" height="1267" fill="#1F2937"/>
  <rect x="14" y="20" width="28" height="28" rx="4" fill="#374151"/>
  <rect x="14" y="60" width="28" height="28" rx="4" fill="#374151"/>
  <rect x="14" y="100" width="28" height="28" rx="4" fill="#03A9F4"/>
  <rect x="14" y="140" width="28" height="28" rx="4" fill="#374151"/>
  <rect x="14" y="180" width="28" height="28" rx="4" fill="#374151"/>

  <!-- Top app bar -->
  <rect x="56" y="0" width="1517" height="56" fill="#1F2937"/>
  <text x="80" y="34" font-family="Roboto, system-ui, sans-serif" font-size="18" fill="#F9FAFB">Overview</text>

  <!-- Single view tab -->
  <rect x="56" y="56" width="120" height="40" fill="#03A9F4"/>
  <text x="116" y="82" font-family="Roboto, system-ui, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Default</text>

  <!-- Wall of entity cards — all jumbled, no grouping -->
  <g font-family="Roboto, system-ui, sans-serif" fill="#F9FAFB">

    <!-- Row 1 -->
    <g transform="translate(80, 120)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#FFC107"/>
      <text x="56" y="26" font-size="13">light.0x842b95fffe96f43c_l1</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">on · brightness 254</text>
      <text x="320" y="36" font-size="13" text-anchor="end">On</text>
    </g>
    <g transform="translate(440, 120)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">sensor.0x158d000123abcd_temp</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">21.4 °C</text>
    </g>
    <g transform="translate(800, 120)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#FFC107"/>
      <text x="56" y="26" font-size="13">light.0x00158d4567ef_l2</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">off</text>
    </g>
    <g transform="translate(1160, 120)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#10B981"/>
      <text x="56" y="26" font-size="13">binary_sensor.motion_4a2b</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">clear</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(80, 200)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">sensor.0x842b95_battery</text>
      <text x="56" y="44" font-size="11" fill="#9CA3AF">87%</text>
    </g>
    <g transform="translate(440, 200)">
      <rect width="345" height="60" rx="4" fill="#1F2937"/>
      <circle cx="30" cy="30" r="14" fill="#9CA3AF"/>
      <text x="56" y="26" font-size="13">sensor.0x158d000a_humidity</text>

  <rect x="2"  y="22"  width="9" height="9" rx="1.5" fill="#C76712"/>
  <rect x="12" y="22"  width="9" height="9" rx="1.5" fill="#FBE2A6"/>
  <rect x="22" y="22"  width="9" height="9" rx="1.5" fill="#7CA84A"/>
</svg>
